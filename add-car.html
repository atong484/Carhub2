<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Car - Car Sales Platform</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
        body{
            min-height:100vh;
            background:#0a0a12;
            position:relative;overflow-x:hidden;
            color:#fff;
        }
        #particles{
            position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;
        }


        .navbar {
            position:relative;z-index:2;
            background:rgba(30,30,50,0.7);
            backdrop-filter:blur(15px);
            padding: 18px 25px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            border-bottom:1px solid rgba(255,255,255,0.1);
            box-shadow:0 4px 20px rgba(0,0,0,0.4);
        }
        .logo {
            background:linear-gradient(90deg,#7a00ff,#00ffe7,#ff00c8);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            font-size: 24px;
            font-weight: 700;
        }
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
        }
        .nav-links a {
            color:rgba(255,255,255,0.75);
            text-decoration: none;
            font-size: 16px;
            font-weight:500;
            transition:all 0.3s;
        }
        .nav-links a:hover {
            color:#00ffe7;
            transform:scale(1.08);
        }

        .container {
            position:relative;z-index:2;
            width: 90%;
            max-width: 620px;
            margin: 50px auto;
            padding: 40px 35px;
            background:rgba(30,30,50,0.6);
            backdrop-filter:blur(20px);
            border-radius:24px;
            border:1px solid rgba(255,255,255,0.1);
            box-shadow:0 10px 40px rgba(0,0,0,0.6);
        }
        .title {
            font-size:28px;font-weight:700;
            background:linear-gradient(90deg,#7a00ff,#00ffe7,#ff00c8);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            text-align:center;
            margin-bottom: 35px;
        }
        .form-group {
            margin-bottom:22px;
        }
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color:rgba(255,255,255,0.85);
            font-size:15px;
        }
        .form-group input, .form-group select {
            width: 100%;
            height:52px;
            background:rgba(20,20,40,0.7);
            border:1px solid rgba(255,255,255,0.15);
            border-radius:14px;
            padding:0 18px;
            font-size:16px;
            color:#fff;
            outline:none;
            transition:all 0.3s;
        }
        .form-group input::placeholder{
            color:rgba(255,255,255,0.4);
        }
        .form-group input:focus, .form-group select:focus{
            border-color:#7a00ff;
            box-shadow:0 0 12px #7a00ff;
            transform:scale(1.03);
        }

        #carImage{
            padding:14px 18px;
            height:auto;
            cursor:pointer;
        }

        .submit-btn {
            width:100%;
            height:54px;
            background:linear-gradient(90deg,#7a00ff,#00ffe7,#ff00c8);
            color:#fff;
            border:none;
            border-radius:14px;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:all 0.3s;
            margin-top:10px;
            box-shadow:0 6px 20px rgba(122,0,255,0.3);
        }
        .submit-btn:hover {
            transform:translateY(-3px);
            box-shadow:0 10px 30px rgba(122,0,255,0.5);
        }


        .msg{
            position:relative;z-index:2;
            text-align:center;
            color:#fff;
            margin:18px 0;
            font-size:15px;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                text-align: center;
                padding:15px;
            }
            .nav-links {
                justify-content: center;
            }
            .container{
                padding:30px 20px;
                margin:30px auto;
            }
        }
    </style>
</head>
<body>

    <div id="particles"></div>

    <div class="navbar">
        <div class="logo">Car Sales Platform</div>
        <div class="nav-links">
            <a href="index.html">Home</a >
            <a href="seller.html">Seller Center</a >
            <a href="register.html">Register</a >
            <a href="login.html">Login</a >
            <a href="add-car.html">Add Car</a >
            <a href="search.html">Search Car</a >
        </div>
    </div>

    <div class="container">
        <h2 class="title">Add Car Information</h2>
        <form id="addCarForm" onsubmit="return validateForm()">
            <div class="form-group">
                <label>Car Color</label>
                <input type="text" id="color" placeholder="Enter car color" required>
            </div>

            <div class="form-group">
                <label>Car Model</label>
                <input type="text" id="model" placeholder="e.g. Toyota Camry" required>
            </div>

            <div class="form-group">
                <label>Manufacture Year</label>
                <input type="number" id="year" placeholder="e.g. 2020" min="1900" max="2025" required>
            </div>

            <div class="form-group">
                <label>Car Location</label>
                <input type="text" id="location" placeholder="e.g. New York" required>
            </div>

            <div class="form-group">
                <label>Price (USD)</label>
                <input type="number" id="price" placeholder="Enter car price" min="1" required>
            </div>

            <div class="form-group">
                <label>Upload Car Image</label>
                <input type="file" id="carImage" accept="image/*" required>
            </div>

            <button type="submit" class="submit-btn">Submit Car Information</button>
        </form>
        <div class="msg" id="tip"></div>
    </div>


    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>

        particlesJS("particles",{
            particles:{number:{value:80},size:{value:2.5},color:{value:"#ffffff"},
            line_linked:{enable:true,distance:120,color:"#ffffff",opacity:0.15,width:1},
            move:{enable:true,speed:0.8,straight:false}},
            interactivity:{events:{onhover:{enable:true,mode:"grab"}}},retina_detect:true
        });

        function validateForm() {
            const year = document.getElementById('year').value;
            const price = document.getElementById('price').value;
            const tip = document.getElementById('tip');
            
            if(year < 1900 || year > 2025) {
                tip.innerText = '❌ Please enter a valid year!';
                tip.style.color = '#ff4444';
                return false;
            }
            if(price <= 0) {
                tip.innerText = '❌ Price must be greater than 0!';
                tip.style.color = '#ff4444';
                return false;
            }
            tip.innerText = '✅ Car information added successfully!';
            tip.style.color = '#00ffe7';
            return true;
        }
    </script>
</body>
</html>
